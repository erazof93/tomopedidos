# PREPARED ONLY. Never use root compose/.env. No host ports or existing volumes.
name: tp-b2a-f-20261014-r01
services:
  postgres:
    container_name: tp-b2a-f-20261014-r01-pg
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: tp_b2a_f_20261014_r01
      POSTGRES_USER: tomopedidos_bootstrap
      POSTGRES_PASSWORD: ${F_BOOTSTRAP_PASSWORD:?Separate private F credentials required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    command:
      - postgres
      - -c
      - cluster_name=tp-b2a-f-20261014-r01
      - -c
      - timezone=UTC
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      - type: volume
        source: f_data
        target: /var/lib/postgresql
      - type: bind
        source: ./staged
        target: /f/staged
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./control
        target: /f/control
        read_only: true
        bind:
          create_host_path: false
    networks: [f_net]
    labels:
      pe.tomopedidos.f.run: tp-b2a-f-20261014-r01
      pe.tomopedidos.f.disposable: "true"
    restart: "no"
networks:
  f_net:
    name: tp-b2a-f-20261014-r01-net
    internal: true
volumes:
  f_data:
    name: tp-b2a-f-20261014-r01-data
