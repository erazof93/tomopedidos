schema_version: 1
package: b2a-role-isolation
version: 1
status: prepared_static_only_not_applied
installation: administrative_psql_outside_goose
target:
  database: tomopedidos_local
  postgres_major: 18
  administrator: tomopedidos_bootstrap
  isolated_host_volume_requires_separate_approval: true
roles:
  tomopedidos_auth_executor:
    login: false
    inherit: false
    elevated_attributes: false
    memberships: []
    owns: seven_normal_C_functions_only
  tomopedidos_auth_revoke_executor:
    login: false
    inherit: false
    elevated_attributes: false
    memberships: []
    owns: two_privileged_C_functions_only
    operational_callers: []
  tomopedidos_auth_runtime:
    login: true
    password: null
    inherit: false
    elevated_attributes: false
    memberships: []
    owns: []
    authentication_setup: separate_private_authorized_procedure
stages:
  provisioned: roles_only_no_connect_usage_execute
  c: C_installed_owner_only_no_column_grants
  executors: executor_usage_and_column_grants_auth_disconnected
  enabled: auth_connect_usage_and_seven_normal_execute_only
transitions:
  provision: ../b2a-role-provision-v1.sql
  executor_grants: ../b2a-auth-grants-v1.sql
  caller_enable: ../b2a-auth-enable-v1.sql
  caller_disable: ../b2a-auth-disable-v1.sql
  executor_ungrant: ../b2a-auth-ungrant-v1.sql
security:
  no_B1_modification: true
  no_owner_memberships_or_takeover: true
  no_table_level_grants: true
  no_grant_option: true
  no_role_settings: true
  no_default_acl_edits: true
  no_retries: true
  no_automatic_role_drop: true
  public_identity_access: false
  tenant_identity_access: false
  raw_password_token_csrf_key_in_files: false
privileged_functions_denied_to_auth_tenant_public:
  - "identity.revoke_audience(bytea, text)"
  - "identity.revoke_global(bytea, text)"
requested_conceptual_names_not_C_contracts:
  - revoke_audience_privileged
  - revoke_global_privileged
unexpected_privileged_alias_policy: abort_do_not_rename_C
normal_auth_execute_after_separate_enable:
  - "identity.lookup_credential(text, text)"
  - "identity.issue_session(uuid, bigint, bigint, bigint, text, uuid, bytea, text, bytea)"
  - "identity.validate_session(bytea, text)"
  - "identity.record_activity(bytea, text)"
  - "identity.revoke_session(bytea, text)"
  - "identity.mark_expired(bytea, text)"
  - "identity.rehash_conditional(uuid, bigint, text, text)"
column_permissions:
  - role: tomopedidos_auth_executor
    table: identity.identities
    privilege: SELECT
    columns: [id,email_canonical,status,email_verified_at,auth_epoch,credential_revision,created_at]
  - role: tomopedidos_auth_executor
    table: identity.identities
    privilege: UPDATE
    columns: [credential_revision]
  - role: tomopedidos_auth_executor
    table: identity.identity_credentials
    privilege: SELECT
    columns: [identity_id,password_hash]
  - role: tomopedidos_auth_executor
    table: identity.identity_credentials
    privilege: UPDATE
    columns: [password_hash,changed_at]
  - role: tomopedidos_auth_executor
    table: identity.audience_revocations
    privilege: SELECT
    columns: [identity_id,audience,auth_epoch]
  - role: tomopedidos_auth_executor
    table: identity.audience_revocations
    privilege: UPDATE
    columns: [audience]
  - role: tomopedidos_auth_executor
    table: identity.sessions
    privilege: SELECT
    columns: [session_id,identity_id,audience,token_hash,identity_epoch,audience_epoch,authentication_level,csrf_key_id,csrf_generation,csrf_salt,created_at,last_activity_at,idle_expires_at,absolute_expires_at,revoked_at,expired_at]
  - role: tomopedidos_auth_executor
    table: identity.sessions
    privilege: INSERT
    columns: [session_id,identity_id,audience,token_hash,identity_epoch,audience_epoch,authentication_level,csrf_key_id,csrf_generation,csrf_salt,created_at,last_activity_at,idle_expires_at,absolute_expires_at]
  - role: tomopedidos_auth_executor
    table: identity.sessions
    privilege: UPDATE
    columns: [last_activity_at,idle_expires_at,revoked_at,expired_at]
  - role: tomopedidos_auth_revoke_executor
    table: identity.identities
    privilege: SELECT
    columns: [id,status,email_verified_at,auth_epoch,credential_revision,created_at]
  - role: tomopedidos_auth_revoke_executor
    table: identity.identities
    privilege: UPDATE
    columns: [auth_epoch]
  - role: tomopedidos_auth_revoke_executor
    table: identity.audience_revocations
    privilege: SELECT
    columns: [identity_id,audience,auth_epoch]
  - role: tomopedidos_auth_revoke_executor
    table: identity.audience_revocations
    privilege: UPDATE
    columns: [auth_epoch]
  - role: tomopedidos_auth_revoke_executor
    table: identity.sessions
    privilege: SELECT
    columns: [session_id,identity_id,audience,token_hash,identity_epoch,audience_epoch,authentication_level,csrf_key_id,csrf_generation,csrf_salt,created_at,last_activity_at,idle_expires_at,absolute_expires_at,revoked_at,expired_at]
  - role: tomopedidos_auth_revoke_executor
    table: identity.sessions
    privilege: UPDATE
    columns: [expired_at]
