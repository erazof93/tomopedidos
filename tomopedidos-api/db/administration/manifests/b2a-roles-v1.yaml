  public: ACL_grantee_zero_not_a_login_role
  static: ../../verification/check_b2a_delivery_d.ps1
  PostgreSQL_executed: false
execution_gates:
  - explicit_target_and_SQL_authorization
  - A_B_applied_and_full_metadata_guards_verified
  - C_installed_and_exact_source_owner_ACL_verified
  - executor_function_paths_locks_triggers_search_path_tests
  - independent_authorization_for_caller_enable
  - private_credentials_HBA_TLS_review
  - actual_auth_and_tenant_login_negative_evidence
  - trusted_Go_proof_authority_CSRF_commit_boundary_before_API_use
