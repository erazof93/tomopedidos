# Derived from concrete SQL. This is a PLAN for D, not executable GRANT SQL.
# Row locking needs SELECT and UPDATE on at least one column. The normal
# executor uses immutable audience as its lock-only UPDATE column; B blocks
# rekeying. Do not grant it UPDATE(auth_epoch) on audience_revocations.
executor_permission_plan:
  tomopedidos_auth_executor:
    schema_usage: [identity]
    tables:
      identity.identities:
        select: [id, email_canonical, status, email_verified_at, auth_epoch, credential_revision, created_at]
        update: [credential_revision]
      identity.identity_credentials:
        select: [identity_id, password_hash]
        update: [password_hash, changed_at]
      identity.audience_revocations:
        select: [identity_id, audience, auth_epoch]
        update: [audience]
      identity.sessions:
        select: all_columns_used_by_typed_row
        insert: [session_id, identity_id, audience, token_hash, identity_epoch, audience_epoch, authentication_level, csrf_key_id, csrf_generation, csrf_salt, created_at, last_activity_at, idle_expires_at, absolute_expires_at]
        update: [last_activity_at, idle_expires_at, revoked_at, expired_at]
  tomopedidos_auth_revoke_executor:
    schema_usage: [identity]
    tables:
      identity.identities:
        select: [id, status, email_verified_at, auth_epoch, credential_revision, created_at]
        update: [auth_epoch]
      identity.audience_revocations:
        select: [identity_id, audience, auth_epoch]
        update: [auth_epoch]
      identity.sessions:
        select: all_columns_used_by_typed_row
        update: [expired_at]
    # UPDATE(expired_at) supports session FOR UPDATE and terminal detection.
    # No credential access, session insertion, activity or individual logout.
  caller:
    connect: tomopedidos_local
    schema_usage: [identity]
    direct_table_access: none
    execute: only_seven_normal_signatures_after_D_verification
  denied_for_all_operational_actors:
    - identity_schema_CREATE
    - table_ownership
    - DDL
    - business_schema_access
    - membership_in_owner_migrator_or_executors
    - direct_identity_administration
    - cleanup
operational_gates:
  - separate_authorization_for_role_provisioning
  - separate_authorization_for_A_B_migrations_and_C_install
  - D_table_column_privileges_and_negative_isolation_tests
  - no_privileged_caller_until_fresh_auth_MFA_authority_contract_approved
  - B2B_trusted_proof_interactive_activity_logout_CSRF_and_commit_handling
  - Argon2_profiles_benchmark_and_limits
  - CSRF_binary_keyring_and_logging_policy

